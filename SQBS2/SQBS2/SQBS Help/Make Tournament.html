        <h2>Making a New Tournament</h2>
        
        <p>Opening the SQBS application will create a new blank tournament. 
        A new tournament can also be created by clicking the &ldquo;New&rdquo; button on the 
        top toolbar or by selecting &ldquo;New&rdquo; under the File menu; &#8984;N.  Creating a new 
        tournament will open the <a href="TournamentSetup.html">Tournament Setup</a> tab.</p>
