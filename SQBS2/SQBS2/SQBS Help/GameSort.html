        <h2>Game Sorting</h2>
        
        <p>
        Games can be sorted by Game ID, Round or Round, Game ID using 
        the &ldquo;Sort Games&rdquo; button on the toolbar.
        </p>
        <p>
        &ldquo;Sort Games&rdquo; only effects the order that Games will
        appear in the &ldquo;Game Entry&rdquo; tab. Use the
        <a href="SortSetting.html">Sorting</a> to change sorting for reports.
        </p>
