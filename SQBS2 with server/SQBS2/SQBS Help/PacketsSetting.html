        <h3>Packets Settings</h3>
        
        <p>
        Packet names can be entered here. As round numbers are used in 
        the <a href="GameEntry.html">Game Entry</a> screen, they create 
        an entry in the packet name table. To enter a name, double&ndash;click 
        on the dash in the empty field beside a round number. To exit the 
        field, hit the Return key or select another round.
