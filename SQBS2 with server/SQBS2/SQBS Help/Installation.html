        <h2>Installation</h2>
        
        <p>
        SQBS will run on any Intel Macintosh using OS 10.4.4 or higher. Opening the 
        archive SQBS.zip will produce the SQBS application, which (optionally) can be moved to the Applications folder.
        </p>
        <p>
        To uninstall simply delete the SQBS application.
        </p>
